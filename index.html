<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="ExpensesDu é um assistente financeiro que registra seus gastos por mensagem. Sem formulários, sem atrito." />
    <meta property="og:title" content="ExpensesDu - Controle financeiro sem formulários" />
    <meta property="og:description" content="Anote seus gastos em segundos escrevendo uma simples frase." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:type" content="website" />
    <title>ExpensesDu</title>
    <script>
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
